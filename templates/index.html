<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Texto para Fala</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #f8f9fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e9ecef;
            --text-primary: #212529;
            --text-secondary: #495057;
            --text-muted: #6c757d;
            --accent: #667eea;
            --accent-hover: #764ba2;
            --border: #dee2e6;
            --success: #28a745;
            --error: #dc3545;
            --warning: #ffc107;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --accent: #818cf8;
            --accent-hover: #a78bfa;
            --border: #334155;
            --success: #4ade80;
            --error: #f87171;
            --warning: #fbbf24;
            --shadow: rgba(0, 0, 0, 0.4);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .container {
            background: var(--bg-secondary);
            border-radius: 20px;
            padding: 40px;
            max-width: 700px;
            width: 100%;
            box-shadow: 0 20px 60px var(--shadow);
            transition: all 0.3s ease;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        h1 {
            color: var(--accent);
            font-size: 2.5em;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .theme-toggle {
            background: var(--accent);
            border: none;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            cursor: pointer;
            font-size: 1.5em;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .theme-toggle:hover {
            background: var(--accent-hover);
            transform: rotate(180deg);
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-primary);
            font-weight: 600;
            font-size: 1.1em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1em;
            resize: vertical;
            min-height: 120px;
            font-family: inherit;
            background: var(--bg-secondary);
            color: var(--text-primary);
            transition: all 0.3s ease;
        }

        textarea::placeholder {
            color: var(--text-muted);
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .btn-secondary {
            padding: 10px 20px;
            background: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border);
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1em;
            background: var(--bg-secondary);
            color: var(--text-primary);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        select:focus {
            outline: none;
            border-color: var(--accent);
        }

        select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .slider-label {
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.95em;
            min-width: 50px;
        }

        input[type="range"] {
            flex: 1;
            height: 8px;
            border-radius: 5px;
            background: var(--bg-tertiary);
            outline: none;
            -webkit-appearance: none;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid var(--bg-secondary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--accent-hover);
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--accent);
            cursor: pointer;
            border: 2px solid var(--bg-secondary);
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }

        .slider-value {
            min-width: 60px;
            text-align: center;
            font-weight: 700;
            color: var(--accent);
            font-size: 1.1em;
        }

        button[type="submit"] {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-hover) 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .audio-container {
            margin-top: 30px;
            padding: 20px;
            background: var(--bg-tertiary);
            border-radius: 10px;
            display: none;
        }

        .audio-container.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .audio-container h3 {
            color: var(--text-primary);
            margin-bottom: 10px;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        audio {
            width: 100%;
            margin-top: 10px;
        }

        .download-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: var(--success);
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .download-btn:hover {
            background: #218838;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            color: var(--accent);
            font-weight: 600;
            margin-top: 15px;
            display: none;
        }

        .loading.show {
            display: block;
        }

        .error {
            background: rgba(220, 53, 69, 0.15);
            color: var(--error);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid var(--error);
            font-weight: 500;
        }

        .error.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .warning {
            background: rgba(255, 193, 7, 0.15);
            color: var(--warning);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
            border-left: 4px solid var(--warning);
            font-weight: 500;
        }

        .warning.show {
            display: block;
            animation: slideDown 0.3s ease;
        }

        .countdown {
            font-weight: bold;
            color: var(--accent);
        }

        .history {
            margin-top: 30px;
            padding: 20px;
            background: var(--bg-tertiary);
            border-radius: 10px;
        }

        .history h3 {
            color: var(--text-primary);
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .btn-limpar-historico {
            background: var(--error);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-limpar-historico:hover {
            background: #c82333;
            transform: translateY(-1px);
        }

        .history-item {
            padding: 12px;
            background: var(--bg-secondary);
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.3s ease;
            border: 1px solid var(--border);
        }

        .history-item:hover {
            transform: translateX(5px);
            box-shadow: 0 5px 15px var(--shadow);
        }

        .history-item-text {
            flex: 1;
            color: var(--text-primary);
            font-size: 0.9em;
            cursor: pointer;
        }

        .history-item-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item-voz {
            color: var(--accent);
            font-size: 0.85em;
            font-weight: 600;
        }

        .btn-delete {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.2em;
            padding: 5px 8px;
            border-radius: 5px;
            transition: all 0.3s ease;
            opacity: 0.7;
        }

        .btn-delete:hover {
            opacity: 1;
            background: rgba(220, 53, 69, 0.15);
            transform: scale(1.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }

            h1 {
                font-size: 1.8em;
            }

            .header {
                flex-direction: column;
                gap: 15px;
            }

            .slider-container {
                flex-direction: column;
                align-items: stretch;
                gap: 8px;
            }

            .slider-label {
                text-align: center;
            }

            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎙️ Texto para Fala</h1>
            <button class="theme-toggle" id="themeToggle" title="Alternar tema">🌙</button>
        </div>
        
        <form id="ttsForm">
            <div class="form-group">
                <label for="texto">Digite seu texto:</label>
                <textarea id="texto" name="texto" placeholder="Digite o texto que você quer converter em áudio..." required></textarea>
                <div class="button-group">
                    <button type="button" class="btn-secondary" id="limparBtn">🗑️ Limpar</button>
                    <button type="button" class="btn-secondary" id="exemploBtn">📝 Exemplo</button>
                </div>
            </div>

            <div class="form-group">
                <label for="voz">Selecione a voz:</label>
                <select id="voz" name="voz" required>
                    <optgroup label="🇧 Português (Brasil)">
                        <optgroup label="Masculinas">
                            <option value="pt-BR-AntonioNeural">Antonio (Maduro, Natural)</option>
                        </optgroup>
                        <optgroup label="Femininas">
                            <option value="pt-BR-FranciscaNeural">Francisca (Natural)</option>
                        </optgroup>
                    </optgroup>
                    <optgroup label="🇸 English (US)">
                        <optgroup label="Male">
                            <option value="en-US-GuyNeural">Guy (Natural)</option>
                            <option value="en-US-AndrewNeural">Andrew</option>
                            <option value="en-US-ChristopherNeural">Christopher</option>
                            <option value="en-US-EricNeural">Eric</option>
                            <option value="en-US-RogerNeural">Roger</option>
                            <option value="en-US-SteffanNeural">Steffan</option>
                        </optgroup>
                        <optgroup label="Female">
                            <option value="en-US-JennyNeural">Jenny (Natural)</option>
                            <option value="en-US-MichelleNeural">Michelle</option>
                        </optgroup>
                    </optgroup>
                    <optgroup label="🇸 Español (España)">
                        <option value="es-ES-AlvaroNeural">Alvaro (Masculino)</option>
                        <option value="es-ES-ElviraNeural">Elvira (Feminino)</option>
                    </optgroup>
                    <optgroup label="🇫 Français (France)">
                        <option value="fr-FR-HenriNeural">Henri (Masculino)</option>
                        <option value="fr-FR-DeniseNeural">Denise (Feminino)</option>
                    </optgroup>
                    <optgroup label="🇩🇪 Deutsch (Germany)">
                        <option value="de-DE-ConradNeural">Conrad (Masculino)</option>
                        <option value="de-DE-KatjaNeural">Katja (Feminino)</option>
                    </optgroup>
                </select>
            </div>

            <div class="form-group">
                <label for="rate">Velocidade: <span id="rateValue" class="slider-value">+0%</span></label>
                <div class="slider-container">
                    <span class="slider-label">-50%</span>
                    <input type="range" id="rate" name="rate" min="-50" max="100" value="0" step="5">
                    <span class="slider-label">+100%</span>
                </div>
            </div>

            <div class="form-group">
                <label for="pitch">Tom: <span id="pitchValue" class="slider-value">+0Hz</span></label>
                <div class="slider-container">
                    <span class="slider-label">-50Hz</span>
                    <input type="range" id="pitch" name="pitch" min="-50" max="50" value="0" step="5">
                    <span class="slider-label">+50Hz</span>
                </div>
            </div>

            <button type="submit" id="submitBtn">🎵 Gerar Áudio</button>
            
            <div class="loading" id="loading">Gerando áudio... Por favor, aguarde.</div>
            <div class="warning" id="warning">
                 Aguarde <span class="countdown" id="countdown">5</span> segundos para gerar o próximo áudio.
            </div>
            <div class="error" id="error"></div>
        </form>

        <div class="audio-container" id="audioContainer">
            <h3> Seu áudio está pronto!</h3>
            <audio id="audioPlayer" controls></audio>
            <a href="#" id="downloadLink" class="download-btn">⬇️ Baixar MP3</a>
        </div>

        <div class="history" id="historyContainer" style="display: none;">
            <h3>
                <span>📜 Histórico de Áudios</span>
                <button class="btn-limpar-historico" id="limparHistoricoBtn">🗑️ Limpar tudo</button>
            </h3>
            <div id="historyList"></div>
        </div>
    </div>

    <script>
        // Tema escuro/claro
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        const savedTheme = localStorage.getItem('theme') || 'light';
        html.setAttribute('data-theme', savedTheme);
        themeToggle.textContent = savedTheme === 'dark' ? '☀️' : '🌙';
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            themeToggle.textContent = newTheme === 'dark' ? '☀️' : '🌙';
        });

        // Sliders
        const rateSlider = document.getElementById('rate');
        const rateValue = document.getElementById('rateValue');
        const pitchSlider = document.getElementById('pitch');
        const pitchValue = document.getElementById('pitchValue');

        rateSlider.addEventListener('input', function() {
            const value = this.value;
            rateValue.textContent = (value >= 0 ? '+' : '') + value + '%';
        });

        pitchSlider.addEventListener('input', function() {
            const value = this.value;
            pitchValue.textContent = (value >= 0 ? '+' : '') + value + 'Hz';
        });

        // Botões auxiliares
        const limparBtn = document.getElementById('limparBtn');
        const exemploBtn = document.getElementById('exemploBtn');
        const textoArea = document.getElementById('texto');

        limparBtn.addEventListener('click', () => {
            textoArea.value = '';
            textoArea.focus();
        });

        exemploBtn.addEventListener('click', () => {
            textoArea.value = 'No lançamento oblíquo, você sabe qual ângulo faz o objeto ir mais longe? Vamos testar! Primeiro, lançando a 30 graus, o objeto ganha velocidade e atinge uma certa distância. Agora, aumentando para 45 graus... Veja só! Ele atinge o alcance máximo!';
        });

        // Formulário
        const form = document.getElementById('ttsForm');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const warning = document.getElementById('warning');
        const countdown = document.getElementById('countdown');
        const error = document.getElementById('error');
        const audioContainer = document.getElementById('audioContainer');
        const audioPlayer = document.getElementById('audioPlayer');
        const downloadLink = document.getElementById('downloadLink');
        const historyContainer = document.getElementById('historyContainer');
        const historyList = document.getElementById('historyList');
        const limparHistoricoBtn = document.getElementById('limparHistoricoBtn');

        // Carregar histórico
        let historico = JSON.parse(localStorage.getItem('historico') || '[]');
        atualizarHistorico();

        // Controle de tempo entre gerações
        let podeGerar = true;
        let tempoRestante = 0;

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            if (!podeGerar) {
                return;
            }
            
            error.classList.remove('show');
            audioContainer.classList.remove('show');
            warning.classList.remove('show');
            
            loading.classList.add('show');
            submitBtn.disabled = true;
            podeGerar = false;
            
            const formData = new FormData(form);
            const rate = rateSlider.value;
            const pitch = pitchSlider.value;
            
            formData.set('rate', (rate >= 0 ? '+' : '') + rate + '%');
            formData.set('pitch', (pitch >= 0 ? '+' : '') + pitch + 'Hz');
            
            try {
                const response = await fetch('/gerar_audio', {
                    method: 'POST',
                    body: formData
                });
                
                const contentType = response.headers.get('content-type');
                if (!contentType || !contentType.includes('application/json')) {
                    throw new Error(`Servidor retornou HTTP ${response.status} - Resposta não é JSON`);
                }
                
                const data = await response.json();
                
                if (data.sucesso) {
                    audioPlayer.src = data.arquivo;
                    downloadLink.href = data.arquivo.replace('/static/', '/download/');
                    audioContainer.classList.add('show');
                    
                    if (data.mensagem) {
                        warning.textContent = 'ℹ️ ' + data.mensagem;
                        warning.style.background = 'rgba(129, 140, 248, 0.15)';
                        warning.style.color = 'var(--accent)';
                        warning.style.borderLeft = '4px solid var(--accent)';
                        warning.classList.add('show');
                    }
                    
                    historico.unshift({
                        texto: data.texto,
                        voz: data.voz,
                        arquivo: data.arquivo,
                        data: new Date().toLocaleString('pt-BR')
                    });
                    
                    if (historico.length > 10) historico.pop();
                    localStorage.setItem('historico', JSON.stringify(historico));
                    atualizarHistorico();
                } else {
                    error.textContent = 'Erro: ' + data.erro;
                    error.classList.add('show');
                }
            } catch (err) {
                error.textContent = 'Erro ao gerar áudio: ' + err.message;
                error.classList.add('show');
            } finally {
                loading.classList.remove('show');
                
                tempoRestante = 5;
                countdown.textContent = tempoRestante;
                warning.textContent = '⏳ Aguarde ' + tempoRestante + ' segundos para gerar o próximo áudio.';
                warning.style.background = 'rgba(251, 191, 36, 0.15)';
                warning.style.color = 'var(--warning)';
                warning.style.borderLeft = '4px solid var(--warning)';
                warning.classList.add('show');
                
                const intervalo = setInterval(() => {
                    tempoRestante--;
                    countdown.textContent = tempoRestante;
                    warning.textContent = '⏳ Aguarde ' + tempoRestante + ' segundos para gerar o próximo áudio.';
                    
                    if (tempoRestante <= 0) {
                        clearInterval(intervalo);
                        podeGerar = true;
                        submitBtn.disabled = false;
                        warning.classList.remove('show');
                    }
                }, 1000);
            }
        });

        // Limpar todo o histórico
        limparHistoricoBtn.addEventListener('click', () => {
            if (confirm('Deseja limpar TODO o histórico de áudios?')) {
                historico = [];
                localStorage.removeItem('historico');
                atualizarHistorico();
            }
        });

        function atualizarHistorico() {
            if (historico.length === 0) {
                historyContainer.style.display = 'none';
                return;
            }
            
            historyContainer.style.display = 'block';
            historyList.innerHTML = '';
            
            historico.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div class="history-item-text" title="Clique para ouvir">${item.texto}</div>
                    <div class="history-item-actions">
                        <div class="history-item-voz">${item.voz.split('-').pop().replace('Neural', '')}</div>
                        <button class="btn-delete" onclick="deletarAudio(${index})" title="Deletar este áudio">🗑️</button>
                    </div>
                `;
                div.querySelector('.history-item-text').addEventListener('click', () => {
                    audioPlayer.src = item.arquivo;
                    audioContainer.classList.add('show');
                    audioContainer.scrollIntoView({ behavior: 'smooth' });
                });
                historyList.appendChild(div);
            });
        }

        function deletarAudio(index) {
            if (confirm('Deseja remover este áudio do histórico?')) {
                historico.splice(index, 1);
                localStorage.setItem('historico', JSON.stringify(historico));
                atualizarHistorico();
            }
        }
    </script>
</body>
</html>
